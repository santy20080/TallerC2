<!DOCTYPE html>
<html>
<head>
    <title>Inventario</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f0f0f0;
            text-align: center;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #1b5e20;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h1>Lista de Productos</h1>

<table>
    <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Valor Unidad</th>
        <th>Existencias</th>
        <th>Valor Total</th>
        <th>Estado</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Cuaderno</td>
        <td>5000</td>
        <td>100</td>
        <td>500000</td>
        <td>Medio</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Esfero</td>
        <td>2500</td>
        <td>250</td>
        <td>625000</td>
        <td>Alto</td>
    </tr>

    <tr>
        <td>3</td>
        <td>Lápiz</td>
        <td>1500</td>
        <td>30</td>
        <td>45000</td>
        <td>bajo</td>
    </tr>

</table>

</body>
</html>
