<!DOCTYPE html>
<html>
<head>
    <title>Inventario</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f0f0f0;
            text-align: center;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #1b5e20;
            color: white;
        }
    </style>
</head>
<body>

<h1>Lista de Productos</h1>

<table>
    <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Valor Unidad</th>
        <th>Existencias</th>
        <th>Valor Total</th>
        <th>Estado</th>
    </tr>

    {% for p in productos %}
    <tr>
        <td>{{ p.codigo }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.valoru }}</td>
        <td>{{ p.existencias }}</td>
        <td>{{ p.total }}</td>
        <td>{{ p.estado }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
